name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # terser is needed here too: without it test/unit/minify.test.js skips silently, and
      # those are the tests that keep the release minification honest
      - run: npm install --ignore-scripts
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install terser, which build.js minifies with
        run: npm install --ignore-scripts

      - name: Build .mext package
        run: node build.js "${{ steps.version.outputs.version }}" --keep-build

      # Drive the snapshots through the minified tree that was just packaged rather than
      # through the sources, so a minification that changes any output fails here. Not
      # "npm run test:package", which would rebuild the tree as a dev version over the one
      # this job just made with the release version.
      - name: Test the packaged CLI
        run: LE_CLI=.build/cli/index.js npm test

      # A copy under a name with no version in it, so that
      # releases/latest/download/lyrics-extractor.mext is a link that never has to be edited
      # again: it is what the plugin page on musescore.org points at.
      - name: Copy the package to a version-less name
        run: cp lyrics-extractor-${{ steps.version.outputs.version }}.mext lyrics-extractor.mext

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Without this the release is titled after the tag, "v2.0.3", while the ones released
          # by hand read "Lyrics Extractor 2.0.3". The list of releases should not say which of
          # the two made each one.
          name: Lyrics Extractor ${{ steps.version.outputs.version }}
          files: |
            lyrics-extractor-${{ steps.version.outputs.version }}.mext
            lyrics-extractor.mext
          generate_release_notes: true
