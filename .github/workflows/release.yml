name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # terser is needed here too: without it test/minify.test.js skips silently, and
      # those are the tests that keep the release minification honest
      - run: npm install --ignore-scripts
      - run: node --test test/*.test.js

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install terser, which build.js minifies with
        run: npm install --ignore-scripts

      - name: Build .mext package
        run: node build.js "${{ steps.version.outputs.version }}" --keep-build

      # Run the CLI tests against the minified tree that was just packaged, not against
      # the sources: the committed fixture plus the two synthetic scores. The frozen
      # copies are not committed, so the full sweep of 21 scores against the package
      # happens with "npm run test:package" locally.
      - name: Test the packaged CLI
        run: LE_CLI=.build/cli/index.js node --test test/integration.test.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: lyrics-extractor-${{ steps.version.outputs.version }}.mext
          generate_release_notes: true
